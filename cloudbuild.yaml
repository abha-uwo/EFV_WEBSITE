steps:
  # 1. Build the unified container image (Next.js + Express Backend)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/efv-unified:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/efv-unified:latest'
      - '.'

  # 2. Push container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/efv-unified:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/efv-unified:latest']

  # 3. Deploy unified container image to Cloud Run as a single service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'efv-unified'
      - '--image'
      - 'gcr.io/$PROJECT_ID/efv-unified:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '1800'

images:
  - 'gcr.io/$PROJECT_ID/efv-unified:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/efv-unified:latest'
